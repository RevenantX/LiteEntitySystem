  summary: Register entity type with explicit class id (for maps that are not driven by enum)
  example: []
  syntax:
    content: 'protected void RegisterType<TEntity>(ushort classId, string className, EntityConstructor<TEntity> constructor) where TEntity : InternalEntity'
    parameters:
    - id: classId
